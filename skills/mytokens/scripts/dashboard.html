<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyTokens</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b; --track: #eeede8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --track: #2c2c2a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --track: #2c2c2a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 4px; }
h1 { font-size: 22px; margin: 0; font-weight: 650; }
h2 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
.sub { color: var(--ink-2); font-size: 13px; }
.note { color: var(--muted); font-size: 12px; margin-top: 6px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin: 16px 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.wide { margin-top: 12px; }
.kpi-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.kpi-val { font-size: 26px; font-weight: 650; margin: 6px 0 2px; }
.kpi-val small { font-size: 14px; color: var(--ink-2); font-weight: 400; }
.bar { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; margin: 8px 0; }
.bar > i { display: block; height: 100%; border-radius: 4px; }
.rows { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; }
.rows dt { color: var(--ink-2); } .rows dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.st-ok { color: var(--good); } .st-warning { color: #b87d00; } .st-critical { color: var(--critical); }
:root[data-theme="dark"] .st-warning { color: var(--warning); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .st-warning { color: var(--warning); } }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin: 6px 0 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }
.legend i.sq { height: 10px; width: 10px; border-radius: 2px; }
.legend i.dash { background: repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px) !important; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,.12); white-space: nowrap; z-index: 5; display: none; }
.tip b { font-weight: 600; } .tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.two { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); }
@media (max-width: 520px) { .two { grid-template-columns: 1fr; } }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--ink-2); font-weight: 500; }
tr.cur td { font-weight: 600; }
.tablewrap { overflow-x: auto; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 4px 10px; font: inherit; font-size: 12px; color: var(--ink-2); cursor: pointer; }
.seg button.on { background: var(--track); color: var(--ink); font-weight: 600; }
.hits { font-size: 12px; color: var(--ink-2); margin: 0; padding-left: 18px; }
code { font-size: 12px; background: var(--track); padding: 1px 5px; border-radius: 4px; }
select { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; }
.picks { margin-left: auto; display: inline-flex; flex-wrap: wrap; gap: 8px 16px; }
.pick { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.planbox { margin: 14px 0 4px; padding: 14px 18px; border: 2px solid var(--s1); border-radius: 12px;
  background: color-mix(in srgb, var(--s1) 9%, var(--surface));
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.planbox label { font-size: 16px; font-weight: 650; }
.planbox select { font-size: 15px; padding: 7px 12px; border: 1px solid var(--s1); }
.why { margin-top: 8px; font-size: 13px; color: var(--ink-2); max-width: 900px; }
.why summary { cursor: pointer; color: var(--s1); font-weight: 600; width: fit-content; }
.why p { margin: 6px 0; }
.kpi-sub { font-size: 12px; color: var(--ink-2); margin-top: -2px; }
.pay { font-size: 15px; font-weight: 650; margin: 8px 0 2px; }
.value-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 32px; margin-top: 8px; }
.value-x { font-size: 40px; font-weight: 700; line-height: 1; }
.value-x small { display: block; font-size: 13px; font-weight: 400; color: var(--ink-2); margin-top: 6px; max-width: 260px; }
</style>
</head>
<body>
<main>
  <header>
    <h1 data-i18n="title"></h1>
    <span class="sub" id="meta"></span>
    <span class="picks">
      <label class="pick" id="plan-inline"><span data-i18n="plan_label"></span><select class="plan-sel"></select></label>
      <label class="pick"><span data-i18n="lang_label"></span><select id="lang"></select></label>
    </span>
  </header>
  <div class="planbox" id="plan-banner">
    <label for="plan-big" data-i18n="plan_prompt"></label>
    <select class="plan-sel" id="plan-big"></select>
  </div>
  <details class="why"><summary data-i18n="why_title"></summary>
    <p data-i18n="why_body"></p><p data-i18n="disclaimer"></p></details>

  <section class="grid" id="kpis"></section>

  <div class="two">
    <div class="card"><h2 data-i18n="h_session_chart"></h2>
      <div class="sub" id="sess-sub"></div><div class="legend" id="sess-leg"></div><div class="chart" id="sess-chart"></div></div>
    <div class="card"><h2 data-i18n="h_week_chart"></h2>
      <div class="sub" id="week-sub"></div><div class="legend" id="week-leg"></div><div class="chart" id="week-chart"></div></div>
  </div>

  <div class="card wide"><h2 data-i18n="h_days"></h2>
    <div class="sub" data-i18n="sub_days"></div>
    <div class="legend" id="days-leg"></div><div class="chart" id="days-chart"></div></div>

  <div class="card wide"><h2 data-i18n="h_blocks"></h2>
    <div class="sub" data-i18n="sub_blocks"></div>
    <div class="legend" id="blocks-leg"></div><div class="chart" id="blocks-chart"></div></div>

  <div class="card wide" id="value-card"></div>

  <div class="card wide">
    <div class="kpi-top"><h2 data-i18n="h_topup"></h2>
      <div class="seg" id="unit-seg"><button data-u="all" class="on" data-i18n="u_all"></button><button data-u="out" data-i18n="u_out"></button></div></div>
    <div class="sub" id="topup-sub"></div>
    <div class="legend" id="topup-leg"></div><div class="chart" id="topup-chart"></div>
    <div class="tablewrap" style="margin-top:12px"><table id="topup-table"></table></div>
    <div class="note" data-i18n="topup_note"></div>
  </div>

  <div class="two wide">
    <div class="card"><h2 data-i18n="h_mix"></h2><div class="tablewrap"><table id="mix-table"></table></div>
      <div class="note" data-i18n="note_mix"></div></div>
    <div class="card"><h2 data-i18n="h_hits"></h2><ul class="hits" id="hits"></ul></div>
  </div>
</main>
<script>
const DATA = /*__DATA__*/null;
const I18N = /*__I18N__*/null;
let lang = DATA.lang in I18N ? DATA.lang : 'en';
try { const saved = JSON.parse(localStorage.getItem('mytokens-lang') || 'null');
  if (saved && saved.base === DATA.lang && saved.lang in I18N) lang = saved.lang; } catch (e) {}
const t = (k, v = {}) => String(I18N[lang]?.[k] ?? I18N.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
const loc = () => I18N[lang]._locale || 'en-US';
const FAM = {opus: ['Opus', '--s1'], sonnet: ['Sonnet', '--s2'], haiku: ['Haiku', '--s3'], fable: ['Fable / Mythos', '--s4'], other: [null, '--s5']};
const famName = f => FAM[f][0] || t('fam_other');
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = id => document.getElementById(id);
const usd = x => x == null ? '—' : '$' + (x >= 1000 ? Math.round(x).toLocaleString(loc()) : x >= 10 ? x.toFixed(1) : x.toFixed(2));
const tok = n => { n = +n || 0; for (const [d, s] of [[1e9,'B'],[1e6,'M'],[1e3,'K']]) if (Math.abs(n) >= d) return (n/d).toFixed(n/d >= 100 ? 0 : 1) + s; return Math.round(n) + ''; };
const pad = n => String(n).padStart(2, '0');
const now = DATA.generated;
const shortDate = ts => new Date(ts*1000).toLocaleDateString(loc(), {day: 'numeric', month: 'short'});
function when(ts) {
  if (ts == null) return '—';
  const d = new Date(ts*1000), n = new Date(now*1000), tm = new Date(n); tm.setDate(n.getDate()+1);
  const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  if (d.toDateString() === n.toDateString()) return t('today') + ' ' + hm;
  if (d.toDateString() === tm.toDateString()) return t('tomorrow') + ' ' + hm;
  return shortDate(ts) + ', ' + hm;
}
function dur(s) { s = Math.max(0, Math.round(s)); const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
  return d ? t('dur_d', {d, h}) : h ? t('dur_h', {h, m}) : t('dur_m', {m}); }
const wtitle = id => t('w_' + id.replace(':', '_'));
function srcText(src) { if (!src) return '';
  if (src.k === 'calibrated') return t('src_calibrated', {when: when(src.at)});
  if (src.k === 'hits') return t('src_hits', {n: src.n});
  return t('src_' + src.k); }

/* ─── SVG helpers ─── */
const NS = (() => { const d = document.createElement('div'); d.innerHTML = '<svg></svg>'; return d.firstChild.namespaceURI; })();
function el(tag, attrs, parent, text) { const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; if (parent) parent.appendChild(e); return e; }
function ticks(min, max, n = 5) { const span = (max - min) || 1, raw = span / n, mag = 10 ** Math.floor(Math.log10(raw)), r = raw / mag;
  const step = (r >= 7.5 ? 10 : r >= 3.5 ? 5 : r >= 1.5 ? 2 : 1) * mag, out = [];
  for (let v = Math.ceil(min / step) * step; v <= max + step * 1e-6; v += step) out.push(+v.toFixed(10));
  while (out[out.length - 1] < max) out.push(+(out[out.length - 1] + step).toFixed(10)); return out; }
function legend(id, items) { $(id).innerHTML = items.map(([name, color, kind]) =>
  `<span><i class="${kind||''}" style="background:${color};color:${color}"></i>${name}</span>`).join(''); }
function tipFor(box) { let t = box.querySelector('.tip'); if (!t) { t = document.createElement('div'); t.className = 'tip'; box.appendChild(t); } return t; }
function placeTip(box, tip, x, y) { tip.style.display = 'block'; const bw = box.clientWidth, tw = tip.offsetWidth;
  tip.style.left = Math.min(Math.max(0, x + 12), bw - tw) + 'px'; tip.style.top = Math.max(0, y - tip.offsetHeight - 10) + 'px'; }
function timeFmt(span) { return ts => { const d = new Date(ts*1000);
  return span < 2*86400 ? pad(d.getHours()) + ':' + pad(d.getMinutes()) : shortDate(ts); }; }

/* Line chart: series [{name,color,pts:[[x,y]],dash}], hlines [{y,label,color}], vlines [{x,label}], markers [{x,y,color,label}] */
function lineChart(box, o) {
  box.innerHTML = ''; const W = box.clientWidth, Hh = o.height || 250, m = {l: 54, r: 14, t: 14, b: 26};
  if (W < 120) return;
  const svg = el('svg', {viewBox: '0 0 ' + W + ' ' + Hh, height: Hh}, box);
  const xs = [], ys = [0];
  o.series.forEach(s => s.pts.forEach(p => { xs.push(p[0]); ys.push(p[1]); }));
  (o.vlines||[]).forEach(v => xs.push(v.x)); (o.hlines||[]).forEach(h => ys.push(h.y));
  if (!xs.length) { el('text', {x: W/2, y: Hh/2, 'text-anchor': 'middle', fill: cssv('--muted'), 'font-size': 13}, svg, o.empty || ''); return; }
  const x0 = o.xmin ?? Math.min(...xs), x1 = o.xmax ?? Math.max(...xs), yT = ticks(0, Math.max(...ys) * 1.08 || 1), y1 = yT[yT.length-1];
  const X = v => m.l + (v - x0) / ((x1 - x0) || 1) * (W - m.l - m.r), Y = v => Hh - m.b - v / y1 * (Hh - m.t - m.b);
  yT.forEach(v => { el('line', {x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: v ? cssv('--grid') : cssv('--axis'), 'stroke-width': 1}, svg);
    el('text', {x: m.l - 8, y: Y(v) + 4, 'text-anchor': 'end', fill: cssv('--muted'), 'font-size': 11}, svg, o.yFmt(v)); });
  const nx = Math.max(2, Math.min(6, Math.floor((W - m.l - m.r) / 90)));
  const xf = o.xFmt || timeFmt(x1 - x0);
  for (let i = 0; i <= nx; i++) { const v = x0 + (x1 - x0) * i / nx;
    el('text', {x: X(v), y: Hh - 8, 'text-anchor': i === 0 ? 'start' : i === nx ? 'end' : 'middle', fill: cssv('--muted'), 'font-size': 11}, svg, xf(v)); }
  (o.vlines||[]).forEach(v => { el('line', {x1: X(v.x), x2: X(v.x), y1: m.t, y2: Hh - m.b, stroke: v.color || cssv('--axis'), 'stroke-dasharray': '3 3'}, svg);
    el('text', {x: X(v.x) - 4, y: Hh - m.b - 6, 'text-anchor': 'end', fill: cssv('--ink-2'), 'font-size': 11}, svg, v.label); });
  (o.hlines||[]).forEach(h => { el('line', {x1: m.l, x2: W - m.r, y1: Y(h.y), y2: Y(h.y), stroke: h.color, 'stroke-width': 1.5, 'stroke-dasharray': '6 4'}, svg);
    el('text', {x: W - m.r - 4, y: Y(h.y) + (Y(h.y) - m.t < 16 ? 14 : -5), 'text-anchor': 'end', fill: cssv('--ink-2'), 'font-size': 11}, svg, h.label); });
  o.series.forEach(s => { if (!s.pts.length) return;
    el('path', {d: s.pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(''), fill: 'none',
      stroke: s.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-dasharray': s.dash ? '6 4' : null}, svg); });
  (o.markers||[]).forEach(p => { el('circle', {cx: X(p.x), cy: Y(p.y), r: 5, fill: p.color, stroke: cssv('--surface'), 'stroke-width': 2}, svg);
    if (p.label) el('text', {x: X(p.x) + (X(p.x) > W - 120 ? -8 : 8), y: Y(p.y) + 16, 'text-anchor': X(p.x) > W - 120 ? 'end' : 'start', fill: cssv('--ink'), 'font-size': 11, 'font-weight': 600}, svg, p.label); });
  const cross = el('line', {y1: m.t, y2: Hh - m.b, stroke: cssv('--muted'), 'stroke-width': 1, visibility: 'hidden'}, svg);
  const dots = o.series.map(s => el('circle', {r: 4, fill: s.color, stroke: cssv('--surface'), 'stroke-width': 2, visibility: 'hidden'}, svg));
  const hit = el('rect', {x: m.l, y: m.t, width: W - m.l - m.r, height: Hh - m.t - m.b, fill: 'transparent'}, svg), tip = tipFor(box);
  hit.addEventListener('mousemove', ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width, xv = x0 + (px - m.l) / (W - m.l - m.r) * (x1 - x0);
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('visibility', 'visible');
    let html = `<b>${o.tipX ? o.tipX(xv) : when(xv)}</b>`;
    o.series.forEach((s, i) => { const p = interp(s.pts, xv, s.step); if (p == null) { dots[i].setAttribute('visibility', 'hidden'); return; }
      dots[i].setAttribute('cx', px); dots[i].setAttribute('cy', Y(p)); dots[i].setAttribute('visibility', 'visible');
      html += `<br><span class="sw" style="background:${s.color}"></span>${s.name}: <b>${(o.tipY || o.yFmt)(p)}</b>`; });
    tip.innerHTML = html; placeTip(box, tip, px, ev.clientY - box.getBoundingClientRect().top);
  });
  hit.addEventListener('mouseleave', () => { tip.style.display = 'none'; cross.setAttribute('visibility', 'hidden'); dots.forEach(d => d.setAttribute('visibility', 'hidden')); });
}
function interp(pts, x, step) { if (!pts.length || x < pts[0][0] || x > pts[pts.length-1][0]) return null;
  let lo = 0, hi = pts.length - 1; while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (pts[mid][0] <= x) lo = mid; else hi = mid; }
  const [a, b] = [pts[lo], pts[hi]]; if (step || b[0] === a[0]) return a[1]; return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]); }

/* Stacked bars: cats [label], series [{name,color,values}], hline {y,label,color}, dots [idx] */
function barChart(box, o) {
  box.innerHTML = ''; const W = box.clientWidth, Hh = o.height || 240, m = {l: 54, r: 10, t: 14, b: 26};
  if (W < 120) return;
  const svg = el('svg', {viewBox: '0 0 ' + W + ' ' + Hh, height: Hh}, box);
  const totals = o.cats.map((_, i) => o.series.reduce((a, s) => a + s.values[i], 0));
  const yT = ticks(0, Math.max(...totals, o.hline ? o.hline.y : 0) * 1.08 || 1), y1 = yT[yT.length-1];
  const Y = v => Hh - m.b - v / y1 * (Hh - m.t - m.b), band = (W - m.l - m.r) / o.cats.length, bw = Math.max(3, Math.min(28, band * 0.7));
  yT.forEach(v => { el('line', {x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: v ? cssv('--grid') : cssv('--axis')}, svg);
    el('text', {x: m.l - 8, y: Y(v) + 4, 'text-anchor': 'end', fill: cssv('--muted'), 'font-size': 11}, svg, o.yFmt(v)); });
  const every = Math.ceil(o.cats.length / Math.max(2, Math.floor((W - m.l) / 56)));
  o.cats.forEach((c, i) => { const cx = m.l + band * (i + .5);
    if (i % every === 0) el('text', {x: cx, y: Hh - 8, 'text-anchor': 'middle', fill: cssv('--muted'), 'font-size': 11}, svg, c);
    let base = 0; const segs = o.series.map(s => s.values[i]).map((v, k) => [v, k]).filter(([v]) => v > 0);
    segs.forEach(([v, k], j) => { const yTop = Y(base + v), yBot = Y(base), top = j === segs.length - 1;
      const h = Math.max(0, yBot - yTop - (j ? 2 : 0)); base += v; if (h <= 0) return;
      const x = cx - bw/2, y = yTop, r = top ? Math.min(4, h, bw/2) : 0;
      el('path', {d: `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + bw - r}Q${x + bw},${y} ${x + bw},${y + r}V${y + h}Z`, fill: o.series[k].color}, svg); });
    if ((o.dots||[]).includes(i)) el('circle', {cx, cy: Y(totals[i]) - 9, r: 4, fill: cssv('--critical'), stroke: cssv('--surface'), 'stroke-width': 2}, svg);
  });
  if (o.hline) { el('line', {x1: m.l, x2: W - m.r, y1: Y(o.hline.y), y2: Y(o.hline.y), stroke: o.hline.color, 'stroke-width': 1.5, 'stroke-dasharray': '6 4'}, svg);
    el('text', {x: W - m.r - 4, y: Y(o.hline.y) - 5, 'text-anchor': 'end', fill: cssv('--ink-2'), 'font-size': 11}, svg, o.hline.label); }
  const tip = tipFor(box), hl = el('rect', {y: m.t, height: Hh - m.t - m.b, width: band, fill: cssv('--ink'), opacity: 0, 'pointer-events': 'none'}, svg);
  svg.insertBefore(hl, svg.firstChild);
  o.cats.forEach((c, i) => { const r = el('rect', {x: m.l + band * i, y: m.t, width: band, height: Hh - m.t - m.b, fill: 'transparent'}, svg);
    r.addEventListener('mousemove', ev => { hl.setAttribute('x', m.l + band * i); hl.setAttribute('opacity', .05);
      tip.innerHTML = o.tip(i); const br = box.getBoundingClientRect(); placeTip(box, tip, ev.clientX - br.left, ev.clientY - br.top); });
    r.addEventListener('mouseleave', () => { tip.style.display = 'none'; hl.setAttribute('opacity', 0); }); });
}

/* ─── KPI cards ─── */
const W = DATA.windows, win = id => W.find(w => w.id === id);
function statusBadge(w) {
  if (w.limit == null) return `<span class="status" style="color:var(--muted)">${t('st_unknown')}</span>`;
  if (w.pct >= 100) return `<span class="status st-critical">${t('st_exhausted')}</span>`;
  if (w.hits_before_reset) return `<span class="status st-warning">${t('st_will_hit')}</span>`;
  if (w.pct >= 80) return `<span class="status st-warning">${t('st_close')}</span>`;
  return `<span class="status st-ok">${t('st_ok')}</span>`;
}
function monthCard(w) {
  return `<div class="card"><div class="kpi-top"><h2>${wtitle(w.id)}</h2></div>
    <div class="kpi-val">${tok(w.used_tok)} <small>${t('th_tokens').toLowerCase()}</small></div>
    <div class="kpi-sub">${t('month_note')}</div>
    <dl class="rows" style="margin-top:8px">
      <dt>${t('k_reset')}</dt><dd>${when(w.end)}</dd>
      <dt>${t('k_pace')}</dt><dd>${tok(w.rate_tok_per_h)}${t('per_h')}</dd>
    </dl></div>`;
}
/* the only place with dollars: subscription vs API prices */
function renderValue() {
  const price = plan ? DATA.plan_prices[plan] : null, api = DATA.month_api_equiv;
  let main;
  if (!plan) main = `<div class="note" style="font-size:14px">${t('month_choose_plan')}</div>`;
  else if (plan === 'api') main = `<div class="note" style="font-size:14px">${t('month_note_api')}</div>`;
  else main = `<div class="value-x">×${(api / price).toFixed(1)}<small>${t('value_sub')}</small></div>`;
  $('value-card').innerHTML = `<h2>${t('value_title')}</h2><div class="value-row">${main}
    <div style="min-width:260px;max-width:560px">
      <p style="margin:0 0 6px;font-size:14px">${t('value_api', {usd: usd(api)})}</p>
      ${plan ? `<dl class="rows"><dt>${t('value_plan')}</dt><dd>${t('plan_' + plan, {price: '$' + DATA.plan_prices[plan]})}</dd></dl>` : ''}
    </div></div>`;
}
function kpi(w) {
  if (w.id === 'month') return monthCard(w);
  const inactive = w.id === 'session' && w.start == null;
  if (inactive) return `<div class="card"><div class="kpi-top"><h2>${wtitle(w.id)}</h2><span class="status st-ok">${t('st_ok')}</span></div>
    <div class="kpi-val">0%</div>
    <div class="bar"><i style="width:0%"></i></div>
    <div class="kpi-sub">${w.prev ? t('k_reset_done', {when: when(w.prev.end)}) : t('no_window_empty')}</div>
    ${w.limit_tok != null ? `<dl class="rows" style="margin-top:8px"><dt>${t('s_limit')}</dt><dd>≈ ${t('tokens_n', {n: tok(w.limit_tok)})}</dd></dl>` : ''}
    <div class="note">${w.limit_source ? t('k_limit', {src: srcText(w.limit_source)}) : ''}</div></div>`;
  const pct = w.pct == null ? null : Math.min(100, w.pct);
  const col = w.status === 'critical' ? 'var(--critical)' : w.status === 'warning' ? 'var(--warning)' : 'var(--s1)';
  let eta = '—';
  if (w.limit != null) eta = w.pct >= 100 ? t('k_hit_now') : w.eta == null ? t('k_no_usage')
    : w.hits_before_reset ? t('k_eta_val', {when: when(w.eta), dur: dur(w.eta - now)}) : t('k_safe');
  const note = w.limit_source ? t('k_limit', {src: srcText(w.limit_source)}) : `${t('k_calibrate')} <code>/mytokens:calibrate</code>`;
  return `<div class="card"><div class="kpi-top"><h2>${wtitle(w.id)}</h2>${statusBadge(w)}</div>
    <div class="kpi-val">${inactive ? '—' : (w.pct != null ? Math.round(w.pct) + '%' : tok(w.used_tok))} ${inactive ? `<small>${t('k_inactive')}</small>` : ''}</div>
    <div class="bar"><i style="width:${pct ?? 0}%;background:${col}"></i></div>
    ${!inactive && w.limit_tok != null ? `<div class="kpi-sub">${t('k_api_line', {used: tok(w.used_tok), limit: tok(w.limit_tok)})}</div>` : ''}
    <dl class="rows" style="margin-top:8px">
      <dt>${t('k_reset')}</dt><dd>${w.rolling ? t('t_rolling') : when(w.end)}</dd>
      <dt>${t('k_eta')}</dt><dd>${eta}</dd>
      ${w.left_seconds ? `<dt>${t('k_left')}</dt><dd>${t('k_left_time', {dur: dur(w.left_seconds)})}</dd>` : ''}
      <dt>${t('k_pace')}</dt><dd>${tok(w.rate_tok_per_h)}${t('per_h')} <span style="color:var(--muted)">(${t('basis_' + w.rate_basis)})</span></dd>
      ${w.overflow_tok ? `<dt>${t('k_buy')}</dt><dd><b>≈ ${t('tokens_n', {n: tok(w.overflow_tok)})}</b></dd>` : ''}
    </dl>
    <div class="note">${note}</div></div>`;
}
function renderKpis() {
  $('kpis').innerHTML = W.map(kpi).join('');
  $('meta').textContent = t('meta', {when: when(now), model: DATA.current_model_name, n: DATA.entries_total.toLocaleString(loc())});
}

/* ─── cumulative usage in a window + forecast ─── */
function windowChart(w, boxId, subId, legId) {
  const box = $(boxId), accent = cssv('--s1');
  if (w && w.start == null && w.prev) {  // window just reset: show the finished one
    const p = w.prev, muted = cssv('--muted');
    $(subId).textContent = t('prev_window', {from: when(p.start), to: when(p.end), pct: p.pct != null ? Math.round(p.pct) + '%' : '—'});
    lineChart(box, {series: [{name: t('s_used'), color: muted, pts: p.curve_tok}], yFmt: tok, xmin: p.start, xmax: p.end,
      hlines: w.limit_tok != null ? [{y: w.limit_tok, label: t('limit_lbl', {v: tok(w.limit_tok)}), color: cssv('--critical')}] : []});
    legend(legId, [[t('s_used'), muted], ...(w.limit_tok != null ? [[t('s_limit'), cssv('--critical'), 'dash']] : [])]);
    return;
  }
  if (!w || w.start == null) { $(subId).textContent = t('no_window'); $(legId).innerHTML = '';
    lineChart(box, {series: [], yFmt: tok, empty: t('no_window_empty')}); return; }
  // a rolling window has no reset: stretch the chart to the forecast hit (at least a day, at most a week)
  const end = w.end ?? Math.min(now + 7 * 86400, Math.max(now + 86400, w.eta ? w.eta + 6 * 3600 : 0)), proj = [];
  if (w.rate_tok_per_h > 0) proj.push([now, w.used_tok], [end, w.used_tok + w.rate_tok_per_h / 3600 * (end - now)]);
  const markers = [];
  if (w.limit != null && w.hits_before_reset && w.pct < 100) markers.push({x: w.eta, y: w.limit_tok, color: cssv('--critical'), label: t('hit_at', {when: when(w.eta)})});
  const series = [{name: t('s_used'), color: accent, pts: w.curve_tok}];
  if (proj.length) series.push({name: t('s_forecast'), color: accent, pts: proj, dash: true});
  lineChart(box, {series, yFmt: tok, xmin: w.start, xmax: end,
    hlines: w.limit_tok != null ? [{y: w.limit_tok, label: t('limit_lbl', {v: tok(w.limit_tok)}), color: cssv('--critical')}] : [],
    vlines: [{x: now, label: t('now')}], markers});
  legend(legId, [[t('s_used'), accent], [t('s_forecast_short'), accent, 'dash'], ...(w.limit != null ? [[t('s_limit'), cssv('--critical'), 'dash']] : [])]);
  $(subId).textContent = t('window_sub', {from: when(w.start), to: w.rolling ? t('rolling_window') : when(w.end), pace: tok(w.rate_tok_per_h)});
}

/* ─── daily history ─── */
function renderDays() {
  const fams = DATA.families.filter(f => DATA.days.some(d => d[f] > 0));
  const series = fams.map(f => ({name: famName(f), color: cssv(FAM[f][1]), values: DATA.days.map(d => d[f] * DATA.tok_per_usd)}));
  const cats = DATA.days.map(d => shortDate(d.t));
  barChart($('days-chart'), {cats, series, yFmt: tok, tip: i =>
    `<b>${cats[i]}</b>` + series.map(s => `<br><span class="sw" style="background:${s.color}"></span>${s.name}: <b>${tok(s.values[i])}</b>`).join('') +
      `<br>${t('total')}: <b>${t('tokens_n', {n: tok(series.reduce((a, s) => a + s.values[i], 0))})}</b>`});
  legend('days-leg', series.map(s => [s.name, s.color, 'sq']));
}

/* ─── 5-hour windows ─── */
function renderBlocks() {
  const B = DATA.blocks, s = win('session'), color = cssv('--s1');
  const cats = B.map(b => shortDate(b.start));
  const hm = ts => { const d = new Date(ts*1000); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  barChart($('blocks-chart'), {cats, series: [{name: t('leg_block'), color, values: B.map(b => b.tok)}], yFmt: tok,
    hline: s.limit_tok != null ? {y: s.limit_tok, label: t('limit_lbl', {v: tok(s.limit_tok)}), color: cssv('--critical')} : null,
    dots: B.map((b, i) => b.hit ? i : -1).filter(i => i >= 0),
    tip: i => `<b>${when(B[i].start)} – ${hm(B[i].start + 18000)}</b><br>${t('tokens_n', {n: tok(B[i].tok)})} · ${t('requests_n', {n: B[i].n})}` +
      (s.limit ? `<br>${t('pct_limit', {p: Math.round(B[i].cost / s.limit * 100)})}` : '') + (B[i].hit ? `<br><b style="color:var(--critical)">${t('hit_limit')}</b>` : '')});
  legend('blocks-leg', [[t('leg_block'), color, 'sq'], ...(s.limit != null ? [[t('leg_limit_est'), cssv('--critical'), 'dash']] : [])]);
}

/* ─── top-up ─── */
let unit = 'all';
function renderTopup() {
  const mods = DATA.topup_models, colors = ['--s1', '--s2', '--s3', '--s4', '--s5'].map(cssv);
  // shortfall in tokens → what buying exactly those tokens on the current model costs
  const curAll = mods.find(m => m.current).usd_per_mtok;
  const needs = W.filter(w => w.overflow_tok).map(w => ({x: w.overflow_tok * curAll / 1e6, label: t('hk_' + w.id.replace(':', '_'))}));
  const xmax = Math.max(100, ...needs.map(n => n.x * 1.25));
  const perUsd = m => 1e6 / (unit === 'all' ? m.usd_per_mtok : m.usd_per_mtok_out);
  const series = mods.map((m, i) => ({name: m.name, color: colors[i], pts: [[0, 0], [xmax, xmax * perUsd(m)]]}));
  const cur = mods.find(m => m.current), markers = needs.map(n => ({x: n.x, y: n.x * perUsd(cur), color: cssv('--critical'), label: t('topup_to_reset', {usd: usd(n.x), w: n.label})}));
  lineChart($('topup-chart'), {series, yFmt: tok, tipY: v => t('tokens_n', {n: tok(v)}), xmin: 0, xmax, xFmt: v => '$' + Math.round(v), tipX: v => '$' + v.toFixed(0), markers, height: 280});
  legend('topup-leg', series.map((s, i) => [s.name + (mods[i].current ? ' ★' : ''), s.color]));
  const sess = win('session'), rate = sess && sess.rate_per_h > 0 ? sess.rate_per_h : (win('week')?.rate24_per_h || 0);
  const amounts = [...new Set([5, 10, 20, 50, 100, 200, ...needs.map(n => Math.ceil(n.x))])].sort((a, b) => a - b);
  $('topup-table').innerHTML = `<tr><th>${t('th_amount')}</th>${mods.map(m => `<th>${m.name}</th>`).join('')}<th>${t('th_hours')}</th></tr>` +
    amounts.map(a => `<tr${needs.some(n => Math.ceil(n.x) === a) ? ' class="cur"' : ''}><td>$${a}</td>${mods.map(m => `<td>${tok(a * perUsd(m))}</td>`).join('')}<td>${rate ? t('hours', {n: (a / rate).toFixed(1)}) : '—'}</td></tr>`).join('');
  $('topup-sub').textContent = unit === 'all' ? t('topup_sub_all', {model: cur.name, usd: usd(cur.usd_per_mtok)})
    : t('topup_sub_out', {model: cur.name, usd: usd(cur.usd_per_mtok_out)});
}
document.querySelectorAll('#unit-seg button').forEach(b => b.onclick = () => {
  unit = b.dataset.u; document.querySelectorAll('#unit-seg button').forEach(x => x.classList.toggle('on', x === b)); renderTopup(); });

/* ─── token mix and limit hits ─── */
function renderMixHits() {
  $('mix-table').innerHTML = `<tr><th>${t('th_type')}</th><th>${t('th_tokens')}</th><th>${t('th_share')}</th></tr>` +
    ['in', 'out', 'cw5', 'cw1h', 'cr'].map(k => `<tr><td>${t('mix_' + k)}</td><td>${tok(DATA.mix_tokens[k])}</td><td>${(DATA.mix[k] * 100).toFixed(1)}%</td></tr>`).join('');
  $('hits').innerHTML = DATA.hits.length ? DATA.hits.slice().reverse().map(h =>
    `<li>${when(h.ts)} — ${t('hk_' + h.kind.replace(':', '_'))}${h.reset ? t('hk_reset', {when: when(h.reset)}) : ''}</li>`).join('')
    : `<li>${t('no_hits')}</li>`;
}

/* ─── language + full render ─── */
const sel = $('lang');
sel.innerHTML = Object.keys(I18N).map(k => `<option value="${k}">${I18N[k]._name}</option>`).join('');
sel.onchange = () => { lang = sel.value;
  try { localStorage.setItem('mytokens-lang', JSON.stringify({lang, base: DATA.lang})); } catch (e) {}
  renderAll(); };
/* ─── plan: from config, or chosen on the page (remembered in this browser) ─── */
let plan = DATA.plan in DATA.plan_prices ? DATA.plan : null;
try { const saved = JSON.parse(localStorage.getItem('mytokens-plan') || 'null');
  if (saved && saved.base === DATA.plan && saved.plan in DATA.plan_prices) plan = saved.plan; } catch (e) {}
function renderPlan() {
  document.querySelectorAll('.plan-sel').forEach(s => {
    s.innerHTML = (plan ? '' : `<option value="">${t('plan_choose')}</option>`) +
      Object.keys(DATA.plan_prices).map(k => `<option value="${k}">${t('plan_' + k, {price: '$' + DATA.plan_prices[k]})}</option>`).join('');
    s.value = plan || '';
    s.title = plan && plan !== DATA.plan ? t('plan_hint', {plan}) : '';
    s.onchange = () => { plan = s.value || null;
      try { localStorage.setItem('mytokens-plan', JSON.stringify({plan, base: DATA.plan})); } catch (e) {}
      renderAll(); };
  });
  $('plan-banner').style.display = plan ? 'none' : '';
  $('plan-inline').style.display = plan ? '' : 'none';
}
function renderAll() {
  document.documentElement.lang = lang; sel.value = lang;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = t(e.dataset.i18n));
  renderPlan();
  renderKpis(); renderValue();
  windowChart(win('session'), 'sess-chart', 'sess-sub', 'sess-leg');
  windowChart(win('week'), 'week-chart', 'week-sub', 'week-leg');
  renderDays(); renderBlocks(); renderTopup(); renderMixHits();
}
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(renderAll, 120); });
renderAll();
</script>
</body>
